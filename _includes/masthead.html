{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <button type="button" class="a11y-toggle" id="a11y-toggle" aria-pressed="false" title="Switch to colorblind-friendly colors and higher contrast">
      <span class="a11y-toggle__icon" aria-hidden="true"></span>
      <span class="a11y-toggle__label">Accessible colors</span>
    </button>
  </div>
</div>
<script>
(function () {
  var KEY = 'a11y-mode';
  var root = document.documentElement;
  var btn = document.getElementById('a11y-toggle');
  function apply(on) {
    if (on) { root.setAttribute('data-a11y', '1'); } else { root.removeAttribute('data-a11y'); }
    if (btn) { btn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved === '1');
  if (btn) {
    btn.addEventListener('click', function () {
      var on = root.getAttribute('data-a11y') !== '1';
      apply(on);
      try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
    });
  }
})();
</script>
