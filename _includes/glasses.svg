<svg class="et-glasses" viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="etg-title">
  <title id="etg-title">Illustration of wearable eye-tracking glasses with a gaze marker</title>
  <defs>
    <linearGradient id="etg-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#d7e2f4"/>
    </linearGradient>
  </defs>
  <!-- gaze trail: where the wearer has looked -->
  <g class="etg-trail" fill="none" stroke="#c96a3a" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" opacity="0.7">
    <path d="M118 112 C 140 60, 230 40, 300 58 S 430 110, 468 70"/>
  </g>
  <g class="etg-dots" fill="#c96a3a">
    <circle cx="300" cy="58" r="3.5" opacity="0.45"/>
    <circle cx="390" cy="86" r="3.5" opacity="0.65"/>
    <circle cx="468" cy="70" r="6"/>
    <circle cx="468" cy="70" r="12" fill="none" stroke="#c96a3a" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- temples -->
  <g stroke="#1f2a44" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M44 128 C 20 128, 12 132, 8 160"/>
    <path d="M476 128 C 500 128, 508 132, 512 160"/>
  </g>
  <!-- frames and lenses -->
  <g stroke="#1f2a44" stroke-width="7" fill="url(#etg-lens)">
    <rect x="48" y="96" width="190" height="104" rx="34"/>
    <rect x="282" y="96" width="190" height="104" rx="34"/>
  </g>
  <!-- bridge with scene camera -->
  <path d="M238 128 C 250 110, 270 110, 282 128" fill="none" stroke="#1f2a44" stroke-width="7" stroke-linecap="round"/>
  <circle cx="260" cy="146" r="11" fill="#1f2a44"/>
  <circle cx="260" cy="146" r="5" fill="#8fb3e8"/>
  <circle cx="258" cy="144" r="1.6" fill="#ffffff"/>
  <!-- inward eye cameras on the lower rims -->
  <circle cx="92" cy="190" r="5" fill="#1f2a44"/>
  <circle cx="426" cy="190" r="5" fill="#1f2a44"/>
  <!-- gaze marker in the right lens -->
  <g fill="none" stroke="#c96a3a" stroke-width="2.5">
    <circle cx="118" cy="112" r="14"/>
    <circle cx="118" cy="112" r="4" fill="#c96a3a" stroke="none"/>
    <path d="M118 90v8M118 126v8M96 112h8M132 112h8" stroke-linecap="round"/>
  </g>
</svg>
